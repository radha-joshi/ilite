<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>I-LITE Command Center</title>
  <style>
    body { 
      background-color: #0f172a; 
      color: #f8fafc; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 50px;
    }
    .dashboard {
      display: flex;
      gap: 20px;
      margin-top: 30px;
    }
    .card { 
      background: #1e293b; 
      padding: 30px; 
      border-radius: 12px; 
      width: 250px; 
      text-align: center; 
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); 
      border-top: 4px solid #38bdf8;
    }
    .value { 
      font-size: 3.5em; 
      font-weight: bold; 
      color: #38bdf8; 
      margin: 15px 0;
    }
    .label {
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.85em;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <h1>I-LITE Telemetry Interface</h1>

  <div class="dashboard">
    <div class="card">
      <div class="label">LED Intensity</div>
      <div class="value" id="light-val">--%</div>
    </div>
    <div class="card" style="border-top-color: #fbbf24;">
      <div class="label">Motion Status</div>
      <div class="value" id="motion-val" style="color: #fbbf24;">--</div>
    </div>
  </div>

  <script>
    // Insert your exact credentials here
    const username = "YOUR_ADAFRUIT_USERNAME";
    const key = "YOUR_ADAFRUIT_ACTIVE_KEY";

    async function fetchAIOData(feedName, elementId, appendString = "") {
      const url = `https://io.adafruit.com/api/v2/${username}/feeds/${feedName}/data/last`;
      
      try {
        const response = await fetch(url, { headers: { "X-AIO-Key": key } });
        if (response.ok) {
          const data = await response.json();
          document.getElementById(elementId).innerText = data.value + appendString;
        }
      } catch (error) {
        console.error(`Error fetching ${feedName}:`, error);
      }
    }

    // Ping the database every 3 seconds to update the UI
    function updateDashboard() {
      fetchAIOData("light-status", "light-val", "%");
      fetchAIOData("motion-status", "motion-val");
    }

    updateDashboard();
    setInterval(updateDashboard, 3000);
  </script>

</body>
</html>
